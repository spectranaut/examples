<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mixing Radios</title>
    <style>
      .example {
        padding: .5em;
        margin: .5em;
        border: 2px solid;
      }
      .radiogroup {
        padding: .5em;
        margin: .5em;
        border: 1px solid;
      }
    </style>
  </head>
  <body>
    <h1>Mixing Radios</h1>
    <div class="example">
      <h2>Example A: Radiogroup with two HTML radios with the same name, then two ARIA radios.</h2>
      <div class="radiogroup" role="radiogroup" aria-label="Pet Names">
        <input type="radio" name="cat" value="ursula" id="ursula" checked>
        <label for="ursula">Ursula</label>
        <input type="radio" name="cat" value="maynard" id="maynard">
        <label for="maynard">Maynard</label>
        <button role="radio">Fido</button>
        <button role="radio">Scout</button>
      </div>
    </div>
    <div class="example">
      <h2>Example B: Radiogroup with two HTML radios with no name, then two ARIA radios.</h2>
      <div class="radiogroup" role="radiogroup" aria-label="Pet Names">
        <input type="radio" value="biz" id="biz" checked>
        <label for="biz">Biz</label>
        <input type="radio" value="baz" id="baz">
        <label for="baz">Baz</label>
        <button role="radio">Foo</button>
        <button role="radio">Bar</button>
      </div>
    </div>
    <div class="example">
      <h2>Example C: No radiogroup. Two HTML radios with no name, then two ARIA Radios.</h2>
      <div>
        <input type="radio" value="biz" id="biz2" checked>
        <label for="biz2">Biz</label>
        <input type="radio" value="baz" id="baz2">
        <label for="baz2">Baz</label>
        <button role="radio">Foo</button>
        <button role="radio">Bar</button>
      </div>
    </div>
  </body>
</html>
