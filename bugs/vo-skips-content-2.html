<!doctype html>
<html lang="en">
  <head>
    <title>VO Skips Content Bug - divs with names</title>
    <style>
      .outerTabindex {
          padding: .5em;
          margin: .5em;
          border: 2px solid;
      }
      .landmark {
          padding: .5em;
          margin: .5em;
          border: 1px solid;
      }
    </style>
  </head>
  <body>
    <a href="#">Link (before nested tabindex=-1)</a>
    <p>In this scenario, the nexted divs with `tabindex=-1` have `aria-label` set on them.</p>
    <div tabindex="-1" aria-label="Buggy Div" class=outerTabindex>
      <div>
        <div tabindex="-1" aria-label="Buggy inner Div">
          <header class=landmark>
            <h2>Header</h2>
            <a href="#">foo</a>, <a href="#">bar</a>
          </header>
          <main class=landmark>
            Main content: <a href="#">biz</a>, <a href="#">baz</a>
          </main>
          <footer class=landmark>
            <h2>Footer</h2>
            <a href="#">cat</a>, <a href="#">dog</a>
          </footer>
        </div>
      </div>
  </body>
</html>
